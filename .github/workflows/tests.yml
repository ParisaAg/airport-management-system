name: Django CI

on:
  push:
    branches:
      - main
      - feature/flight-operations

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements/dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/dev.txt

      - name: Run Django checks
        run: python manage.py check --settings=config.settings.test

      - name: Check migrations
        run: python manage.py makemigrations --check --dry-run --settings=config.settings.test

      - name: Run test suite
        run: python manage.py test --settings=config.settings.test