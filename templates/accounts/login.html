{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>
Login - Airport Management System
</title>


<link rel="stylesheet"
href="{% static 'css/login.css' %}">


</head>


<body>



<div class="login-container">



    <div class="login-card">



        <img 
        src="{% static 'images/logo-mini.png' %}"
        class="login-logo">



        <h1>
            Airport Management
        </h1>



        <p class="subtitle">
            Operations Platform
        </p>





        {% if messages %}
            {% for message in messages %}
                {% if message.tags == "error" %}
                    <div class="error-message" role="alert">
                        {{ message }}
                    </div>
                {% endif %}
            {% endfor %}
        {% endif %} 






        <form method="post">


            {% csrf_token %}



            <div class="input-group">


                <label>
                    Username
                </label>


                <input 
                type="text"
                name="username"
                required>


            </div>





            <div class="input-group">


                <label>
                    Password
                </label>


                <input 
                type="password"
                name="password"
                required>


            </div>





            <button type="submit">

                Login

            </button>




        </form>




    </div>


</div>





</body>

</html>
